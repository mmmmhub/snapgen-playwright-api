<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم SnapGen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #111827; color: #f3f4f6; }
    </style>
</head>
<body class="min-h-screen p-4 flex items-center justify-center">

    <div class="max-w-2xl w-full bg-gray-800 rounded-xl shadow-2xl p-6 border border-gray-700">
        <h1 class="text-2xl font-bold text-center text-blue-400 mb-6">🎬 صانع الفيديوهات الذكي (SnapGen)</h1>
        
        <div class="space-y-4">
            <!-- Token (Smart Memory) -->
            <div>
                <label class="block text-sm font-medium mb-1 text-gray-300">مفتاح جيت هاب السري</label>
                <input type="password" id="githubToken" class="w-full p-3 rounded-lg bg-gray-900 border border-gray-600 focus:border-blue-500 outline-none text-left" dir="ltr" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
                <p class="text-xs text-green-400 mt-1">سيتم حفظ المفتاح في جهازك تلقائياً ولن تحتاجه مرة أخرى.</p>
            </div>

            <!-- Prompt -->
            <div>
                <label class="block text-sm font-medium mb-1 text-gray-300">وصف الفيديو (البرومبت)</label>
                <textarea id="prompt" rows="3" class="w-full p-3 rounded-lg bg-gray-900 border border-gray-600 focus:border-blue-500 outline-none" placeholder="اكتب وصف الفيديو هنا بالتفصيل..."></textarea>
            </div>

            <!-- Settings -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1 text-gray-300">المقاس (طول وعرض)</label>
                    <select id="aspect" class="w-full p-3 rounded-lg bg-gray-900 border border-gray-600 outline-none">
                        <option value="16:9">بالعرض (16:9)</option>
                        <option value="9:16">بالطول (9:16)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1 text-gray-300">المزود (Provider)</label>
                    <select id="provider" class="w-full p-3 rounded-lg bg-gray-900 border border-gray-600 outline-none">
                        <option value="veo">Veo</option>
                        <option value="grok">Grok</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1 text-gray-300">الجودة</label>
                    <select id="resolution" class="w-full p-3 rounded-lg bg-gray-900 border border-gray-600 outline-none">
                        <option value="1080p">عالية (1080p)</option>
                        <option value="720p">متوسطة (720p)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1 text-gray-300">المدة</label>
                    <input type="text" value="8 ثواني" disabled class="w-full p-3 rounded-lg bg-gray-700 border border-gray-600 text-gray-400 cursor-not-allowed outline-none text-center">
                </div>
            </div>

            <!-- Action Button -->
            <button onclick="generateVideo()" id="generateBtn" class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200">
                🚀 بدء توليد الفيديو
            </button>

            <!-- Status -->
            <div id="status" class="hidden mt-4 p-4 rounded-lg bg-gray-900 border border-gray-700 text-center text-sm font-bold"></div>
        </div>
    </div>

    <script>
        // تحميل المفتاح المحفوظ أول ما الصفحة تفتح
        document.addEventListener("DOMContentLoaded", () => {
            const savedToken = localStorage.getItem("snapgen_token");
            if(savedToken) {
                document.getElementById('githubToken').value = savedToken;
            }
        });

        async function generateVideo() {
            const token = document.getElementById('githubToken').value.trim();
            const prompt = document.getElementById('prompt').value.trim();
            const aspect = document.getElementById('aspect').value;
            const resolution = document.getElementById('resolution').value;
            const provider = document.getElementById('provider').value;
            const duration = "8s";
            const statusDiv = document.getElementById('status');
            const btn = document.getElementById('generateBtn');

            if (!token) {
                alert("يرجى إدخال مفتاح جيت هاب أول مرة!");
                return;
            }
            if (!prompt) {
                alert("يا ريس اكتب وصف الفيديو الأول!");
                return;
            }

            // حفظ المفتاح في المتصفح عشان متكتبوش تاني
            localStorage.setItem("snapgen_token", token);

            btn.disabled = true;
            btn.innerHTML = "⏳ جاري إرسال الطلب...";
            btn.classList.replace('bg-blue-600', 'bg-gray-600');
            statusDiv.classList.remove('hidden');
            statusDiv.innerHTML = "<span class='text-yellow-400'>جاري الاتصال بالسيرفر...</span>";

            const repoOwner = "mmmmhub"; 
            const repoName = "snapgen-playwright-api";

            try {
                const response = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/vnd.github.v3+json',
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        event_type: "create_video",
                        client_payload: {
                            prompt: prompt,
                            aspect: aspect,
                            resolution: resolution,
                            duration: duration,
                            provider: provider
                        }
                    })
                });

                if (response.ok) {
                    statusDiv.innerHTML = "<span class='text-green-400'>✅ الطلب وصل السيرفر بنجاح! افتح تبويب Actions عشان تتابع التنفيذ.</span>";
                } else {
                    const err = await response.json();
                    statusDiv.innerHTML = `<span class='text-red-400'>❌ فشل الإرسال: (${err.message})</span>`;
                }
            } catch (error) {
                statusDiv.innerHTML = `<span class='text-red-400'>❌ حدث خطأ في الاتصال!</span>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = "🚀 بدء توليد الفيديو";
                btn.classList.replace('bg-gray-600', 'bg-blue-600');
            }
        }
    </script>
</body>
</html>
